      description: Returns a list of events for the process
      operationId: listProcessEvents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: string
            format: date-time
        - name: fromId
          in: query
          schema:
            type: integer
            format: int64
        - name: eventCorrelationId
          in: query
          schema:
            type: string
            format: uuid
        - name: eventPhase
          in: query
          schema:
            type: string
        - name: includeAll
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
