openapi: 3.0.3
info:
  title: Concord Server API
  description: |
    Concord is a workflow server that orchestrates different systems together using scenarios and plugins.
    This API provides endpoints for managing processes, organizations, projects, secrets, users, and more.
  version: 2.32.1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: Concord Development Team
    url: https://concord.walmartlabs.com

servers:
  - url: /api
    description: Concord Server API

tags:
  - name: Server
    description: Server status and maintenance operations
  - name: Process
    description: Process management operations (v1)
  - name: ProcessV2
    description: Process management operations (v2)
  - name: Organizations
    description: Organization management
  - name: Projects
    description: Project management
  - name: Repositories
    description: Repository management
  - name: RepositoriesV2
    description: Repository management (v2)
  - name: Secrets
    description: Secret management
  - name: SecretsV2
    description: Secret management (v2)
  - name: Secret stores
    description: Secret store management
  - name: Users
    description: User management
  - name: UserV2
    description: User management (v2)
  - name: Teams
    description: Team management
  - name: Roles
    description: Role management
  - name: API keys
    description: API key management
  - name: API keys V2
    description: API key management (v2)
  - name: Agents
    description: Agent management
  - name: Triggers
    description: Trigger management
  - name: TriggersV2
    description: Trigger management (v2)
  - name: Policy
    description: Policy management
  - name: PolicyCheck
    description: Policy check operations
  - name: Inventories
    description: Inventory management
  - name: Inventory Data
    description: Inventory data operations
  - name: Inventory Queries
    description: Inventory query operations
  - name: JsonStore
    description: JSON store management
  - name: JsonStoreData
    description: JSON store data operations
  - name: JsonStoreQuery
    description: JSON store query operations
  - name: Process Forms
    description: Process form operations
  - name: FormsV1
    description: Process form operations (v1)
  - name: Process Events
    description: Process event operations
  - name: Process KV store
    description: Process key-value store operations
  - name: Process Locks
    description: Process lock operations
  - name: ProcessHeartbeat
    description: Process heartbeat operations
  - name: ProcessLogV2
    description: Process log operations (v2)
  - name: Checkpoint
    description: Process checkpoint operations
  - name: CheckpointV2
    description: Process checkpoint operations (v2)
  - name: External Events
    description: External event handling
  - name: GitHub Events
    description: GitHub webhook event handling
  - name: Audit Log
    description: Audit log operations
  - name: TemplateAlias
    description: Template alias management
  - name: UserLdapGroup
    description: User LDAP group operations
  - name: Project Processes
    description: Project process operations
  - name: ProcessCards
    description: Process card operations

paths:
  /v1/server/ping:
    get:
      tags:
        - Server
      summary: Ping the server
      description: Check if the server is alive and the database connection is working
      operationId: ping
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'

  /v1/server/version:
    get:
      tags:
        - Server
      summary: Get server version
      description: Returns the current server version, commit ID, and environment
      operationId: version
      responses:
        '200':
          description: Server version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /v1/server/maintenance-mode:
    post:
      tags:
        - Server
      summary: Enable maintenance mode
      description: Puts the server into maintenance mode, stopping background tasks and message channels
      operationId: maintenanceMode
      responses:
        '200':
          description: Maintenance mode enabled

  /v1/process:
    post:
      tags:
        - Process
      summary: Start new process
      description: Starts a new process instance using multipart form data
      operationId: startProcess
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archive:
                  type: string
                  format: binary
                  description: Process payload archive (ZIP)
                org:
                  type: string
                  description: Organization name
                project:
                  type: string
                  description: Project name
                repo:
                  type: string
                  description: Repository name
                entryPoint:
                  type: string
                  description: Entry point name
                activeProfiles:
                  type: array
                  items:
                    type: string
                  description: Active profiles
                arguments:
                  type: object
                  description: Process arguments
      responses:
        '200':
          description: Process started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartProcessResponse'
    get:
      tags:
        - Process
      summary: List processes
      description: Returns a list of processes with optional filters
      operationId: listProcesses
      parameters:
        - name: orgId
          in: query
          schema:
            type: string
            format: uuid
        - name: orgName
          in: query
          schema:
            type: string
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
        - name: projectName
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProcessStatus'
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of processes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessEntry'

  /v1/process/{id}:
    get:
      tags:
        - Process
      summary: Get process details
      description: Returns details of a specific process instance
      operationId: getProcess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Process details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessEntry'
        '404':
          description: Process not found
    delete:
      tags:
        - Process
      summary: Kill process
      description: Forcefully stops a process
      operationId: killProcess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Process killed

  /v1/process/{id}/restart:
    post:
      tags:
        - Process
      summary: Restart process
      description: Restarts a process instance
      operationId: restartProcess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Process restarted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartProcessResponse'

  /v1/process/{id}/resume/{eventName}:
    post:
      tags:
        - Process
      summary: Resume process
      description: Resumes a suspended process with the specified event
      operationId: resumeProcess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eventName
          in: path
          required: true
          schema:
            type: string
        - name: saveAs
          in: query
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Process resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeProcessResponse'

  /v1/process/{id}/fork:
    post:
      tags:
        - Process
      summary: Fork process
      description: Starts a new child process by forking the start of the specified parent process
      operationId: forkProcess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Process forked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartProcessResponse'

  /v1/process/{id}/cascade:
    delete:
      tags:
        - Process
      summary: Kill process cascade
      description: Forcefully stops a process and all its children
      operationId: killProcessCascade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Process and children killed

  /v1/process/bulk:
    delete:
      tags:
        - Process
      summary: Bulk kill processes
      description: Forcefully stops multiple processes
      operationId: bulkKillProcesses
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
      responses:
        '200':
          description: Processes killed

  /v2/process:
    get:
      tags:
        - ProcessV2
      summary: List processes
      description: Returns a list of processes with optional filters
      operationId: listProcessesV2
      parameters:
        - name: orgId
          in: query
          schema:
            type: string
            format: uuid
        - name: orgName
          in: query
          schema:
            type: string
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
        - name: projectName
          in: query
          schema:
            type: string
        - name: repoId
          in: query
          schema:
            type: string
            format: uuid
        - name: repoName
          in: query
          schema:
            type: string
        - name: afterCreatedAt
          in: query
          schema:
            type: string
            format: date-time
        - name: beforeCreatedAt
          in: query
          schema:
            type: string
            format: date-time
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProcessStatus'
        - name: initiator
          in: query
          schema:
            type: string
        - name: parentInstanceId
          in: query
          schema:
            type: string
            format: uuid
        - name: include
          in: query
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: meta
          in: query
          schema:
            type: object
      responses:
        '200':
          description: List of processes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessEntry'

  /v2/process/{id}:
    get:
      tags:
        - ProcessV2
      summary: Get process details
      description: Returns details of a specific process instance
      operationId: getProcessV2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: include
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Process details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessEntry'
        '404':
          description: Process not found

  /v2/process/count:
    get:
      tags:
        - ProcessV2
      summary: Count processes
      description: Returns the count of processes matching the specified filters
      operationId: countProcesses
      parameters:
        - name: orgId
          in: query
          schema:
            type: string
            format: uuid
        - name: orgName
          in: query
          schema:
            type: string
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
        - name: projectName
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProcessStatus'
      responses:
        '200':
          description: Process count
          content:
            application/json:
              schema:
                type: integer

  /v1/org:
    post:
      tags:
        - Organizations
      summary: Create or update organization
      description: Creates a new organization or updates an existing one
      operationId: createOrUpdateOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationEntry'
      responses:
        '200':
          description: Organization created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrganizationResponse'
    get:
      tags:
        - Organizations
      summary: List organizations
      description: Returns a list of organizations
      operationId: listOrgs
      parameters:
        - name: onlyCurrent
          in: query
          schema:
            type: boolean
            default: false
        - name: offset
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: filter
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationEntry'

  /v1/org/{orgName}:
    get:
      tags:
        - Organizations
      summary: Get organization
      description: Returns details of a specific organization
      operationId: getOrg
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEntry'
        '404':
          description: Organization not found
    delete:
      tags:
        - Organizations
      summary: Delete organization
      description: Removes an existing organization
      operationId: deleteOrg
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: confirmation
          in: query
          required: true
          schema:
            type: string
          description: Must be "yes" to confirm deletion
      responses:
        '200':
          description: Organization deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericOperationResult'

  /v1/org/{orgName}/project:
    post:
      tags:
        - Projects
      summary: Create or update project
      description: Creates a new project or updates an existing one
      operationId: createOrUpdateProject
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectEntry'
      responses:
        '200':
          description: Project created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOperationResponse'
    get:
      tags:
        - Projects
      summary: List projects
      description: Returns a list of projects in the organization
      operationId: listProjects
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: filter
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectEntry'

  /v1/org/{orgName}/project/{projectName}:
    get:
      tags:
        - Projects
      summary: Get project
      description: Returns details of a specific project
      operationId: getProject
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: projectName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEntry'
        '404':
          description: Project not found
    delete:
      tags:
        - Projects
      summary: Delete project
      description: Removes an existing project
      operationId: deleteProject
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: projectName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericOperationResult'

  /v1/org/{orgName}/project/{projectName}/repository:
    post:
      tags:
        - Repositories
      summary: Create or update repository
      description: Creates a new repository or updates an existing one
      operationId: createOrUpdateRepository
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: projectName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryEntry'
      responses:
        '200':
          description: Repository created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericOperationResult'
    get:
      tags:
        - Repositories
      summary: List repositories
      description: Returns a list of repositories in the project
      operationId: listRepositories
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: projectName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryEntry'

  /v1/org/{orgName}/secret:
    post:
      tags:
        - Secrets
      summary: Create or update secret
      description: Creates a new secret or updates an existing one
      operationId: createOrUpdateSecret
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [KEY_PAIR, USERNAME_PASSWORD, DATA]
                storeType:
                  type: string
                data:
                  type: string
                  format: binary
      responses:
        '200':
          description: Secret created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretOperationResponse'
    get:
      tags:
        - Secrets
      summary: List secrets
      description: Returns a list of secrets in the organization
      operationId: listSecrets
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: filter
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecretEntry'

  /v1/org/{orgName}/secret/{secretName}:
    get:
      tags:
        - Secrets
      summary: Get secret
      description: Returns details of a specific secret
      operationId: getSecret
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: secretName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Secret details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretEntry'
        '404':
          description: Secret not found
    delete:
      tags:
        - Secrets
      summary: Delete secret
      description: Removes an existing secret
      operationId: deleteSecret
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: secretName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Secret deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericOperationResult'

  /v1/user:
    post:
      tags:
        - Users
      summary: Create or update user
      description: Creates a new user or updates an existing one
      operationId: createOrUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'

  /v1/user/{username}:
    get:
      tags:
        - Users
      summary: Find user by username
      description: Returns details of a specific user
      operationId: findUserByUsername
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntry'
        '404':
          description: User not found

  /v1/user/{id}:
    delete:
      tags:
        - Users
      summary: Delete user
      description: Removes an existing user
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'

  /v1/user/{id}/disable:
    put:
      tags:
        - Users
      summary: Disable user
      description: Disables an existing user
      operationId: disableUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: permanent
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: User disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntry'

  /v1/org/{orgName}/team:
    post:
      tags:
        - Teams
      summary: Create or update team
      description: Creates a new team or updates an existing one
      operationId: createOrUpdateTeam
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamEntry'
      responses:
        '200':
          description: Team created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTeamResponse'
    get:
      tags:
        - Teams
      summary: List teams
      description: Returns a list of teams in the organization
      operationId: listTeams
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamEntry'

  /v1/role:
    post:
      tags:
        - Roles
      summary: Create or update role
      description: Creates a new role or updates an existing one
      operationId: createOrUpdateRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleEntry'
      responses:
        '200':
          description: Role created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleOperationResponse'
    get:
      tags:
        - Roles
      summary: List roles
      description: Returns a list of roles
      operationId: listRoles
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleEntry'

  /v1/apikey:
    post:
      tags:
        - API keys
      summary: Create API key
      description: Creates a new API key for the current user
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '200':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
    get:
      tags:
        - API keys
      summary: List API keys
      description: Returns a list of API keys for the current user
      operationId: listApiKeys
      parameters:
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
      responses:
