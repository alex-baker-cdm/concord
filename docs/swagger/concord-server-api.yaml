components:
  schemas:
    PingResponse:
      type: object
      properties:
        ok:
          type: boolean

    VersionResponse:
      type: object
      properties:
        version:
          type: string
        commitId:
          type: string
        env:
          type: string

    ProcessStatus:
      type: string
      enum:
        - NEW
        - PREPARING
        - ENQUEUED
        - WAITING
        - STARTING
        - RUNNING
        - SUSPENDED
        - RESUMING
        - FINISHED
        - FAILED
        - CANCELLED
        - TIMED_OUT

    ProcessEntry:
      type: object
      properties:
        instanceId:
          type: string
          format: uuid
        parentInstanceId:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        orgName:
          type: string
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        repoId:
          type: string
          format: uuid
        repoName:
          type: string
        repoUrl:
          type: string
        repoPath:
          type: string
        commitId:
          type: string
        commitBranch:
          type: string
        status:
          $ref: '#/components/schemas/ProcessStatus'
        initiator:
          type: string
        initiatorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastUpdatedAt:
          type: string
          format: date-time
        lastRunAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        handlers:
          type: array
          items:
            type: string
        meta:
          type: object
        disabled:
          type: boolean
        runtime:
          type: string
        timeout:
          type: integer
          format: int64
        suspendTimeout:
          type: integer
          format: int64
        exclusive:
          type: object
        startAt:
          type: string
          format: date-time
        requirements:
          type: object
        out:
          type: object
        checkpoints:
          type: array
          items:
            $ref: '#/components/schemas/ProcessCheckpointEntry'
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/ProcessStatusHistoryEntry'
        childrenIds:
          type: array
          items:
            type: string
            format: uuid

    ProcessCheckpointEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    ProcessStatusHistoryEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ProcessStatus'
        changeDate:
          type: string
          format: date-time
        payload:
          type: object

    StartProcessResponse:
      type: object
      properties:
        ok:
          type: boolean
        instanceId:
          type: string
          format: uuid

    ResumeProcessResponse:
      type: object
      properties:
        ok:
          type: boolean

    OrganizationEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner:
          $ref: '#/components/schemas/EntityOwner'
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
        meta:
          type: object
        cfg:
          type: object

    EntityOwner:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        userDomain:
          type: string
        displayName:
          type: string
        userType:
          type: string

    CreateOrganizationResponse:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
          format: uuid
        result:
          type: string
          enum: [CREATED, UPDATED, DELETED]

    GenericOperationResult:
      type: object
      properties:
        ok:
          type: boolean
        result:
          type: string
          enum: [CREATED, UPDATED, DELETED]

    ProjectEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        orgId:
          type: string
          format: uuid
        orgName:
          type: string
        description:
          type: string
        owner:
          $ref: '#/components/schemas/EntityOwner'
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
        repositories:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RepositoryEntry'
        cfg:
          type: object
        meta:
          type: object
        acceptsRawPayload:
          type: boolean
        outVariablesMode:
          type: string

    ProjectOperationResponse:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
          format: uuid
        result:
          type: string
          enum: [CREATED, UPDATED, DELETED]

    RepositoryEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        branch:
          type: string
        commitId:
          type: string
        path:
          type: string
        secretId:
          type: string
          format: uuid
        secretName:
          type: string
        disabled:
          type: boolean
        triggers:
          type: object
        meta:
          type: object

    SecretEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        orgId:
          type: string
          format: uuid
        orgName:
          type: string
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        type:
          type: string
          enum: [KEY_PAIR, USERNAME_PASSWORD, DATA]
        storeType:
          type: string
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
        owner:
          $ref: '#/components/schemas/EntityOwner'

    SecretOperationResponse:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
          format: uuid
        result:
          type: string
          enum: [CREATED, UPDATED, DELETED]
        password:
          type: string
        publicKey:
          type: string

    UserEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        domain:
          type: string
        displayName:
          type: string
        email:
          type: string
        type:
          type: string
          enum: [LOCAL, LDAP, SSO]
        disabled:
          type: boolean
        disabledDate:
          type: string
          format: date-time
        permanentlyDisabled:
          type: boolean
        roles:
          type: array
          items:
            type: string

    CreateUserRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
        userDomain:
          type: string
        displayName:
          type: string
        email:
          type: string
        type:
          type: string
          enum: [LOCAL, LDAP]
        disabled:
          type: boolean
        roles:
          type: array
          items:
            type: string

    CreateUserResponse:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
          format: uuid
        username:
          type: string
        result:
          type: string
          enum: [CREATED, UPDATED]

    DeleteUserResponse:
      type: object
      properties:
        ok:
          type: boolean

    TeamEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        orgName:
          type: string
        name:
          type: string
        description:
          type: string

    CreateTeamResponse:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
          format: uuid
        result:
          type: string
          enum: [CREATED, UPDATED]

    RoleEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        permissions:
          type: array
          items:
            type: string

    RoleOperationResponse:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
          format: uuid
        result:
          type: string
          enum: [CREATED, UPDATED, DELETED]

    ApiKeyEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        expiredAt:
          type: string
          format: date-time

    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        userId:
          type: string
          format: uuid
        expiredAt:
          type: string
          format: date-time

    CreateApiKeyResponse:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
          format: uuid
        key:
          type: string

    AgentWorkerEntry:
      type: object
      properties:
        agentId:
          type: string
        channelId:
          type: string
        userAgent:
          type: string
        capabilities:
          type: object

    TriggerEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        orgName:
          type: string
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        repositoryId:
          type: string
          format: uuid
        repositoryName:
          type: string
        eventSource:
          type: string
        activeProfiles:
          type: array
          items:
            type: string
        arguments:
          type: object
        conditions:
          type: object
        cfg:
          type: object

    PolicyEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parentId:
          type: string
          format: uuid
        rules:
          type: object

    PolicyOperationResponse:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
          format: uuid
        result:
          type: string
          enum: [CREATED, UPDATED, DELETED]

    InventoryEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        orgId:
          type: string
          format: uuid
        orgName:
          type: string
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
        owner:
          $ref: '#/components/schemas/EntityOwner'
        parentId:
          type: string
          format: uuid

    JsonStoreRequest:
      type: object
      properties:
        name:
          type: string
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
        owner:
          $ref: '#/components/schemas/EntityOwner'

    JsonStoreEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        orgId:
          type: string
          format: uuid
        orgName:
          type: string
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
        owner:
          $ref: '#/components/schemas/EntityOwner'

    FormListEntry:
      type: object
      properties:
        name:
          type: string
        branding:
          type: object
        custom:
          type: boolean
        yield:
          type: boolean

    FormInstanceEntry:
      type: object
      properties:
        processInstanceId:
          type: string
          format: uuid
        name:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormField'
        custom:
          type: boolean
        yield:
          type: boolean

    FormField:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        type:
          type: string
        cardinality:
          type: string
        allowedValue:
          type: object
        value:
          type: object
        options:
          type: object

    FormSubmitResponse:
      type: object
      properties:
        ok:
          type: boolean
        processInstanceId:
          type: string
          format: uuid
        errors:
          type: object

    ProcessEventEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        eventType:
          type: string
        eventDate:
          type: string
          format: date-time
        data:
          type: object

    EventTriggerResult:
      type: object
      properties:
        processId:
          type: string
          format: uuid
        event:
          type: object

    AuditLogEntry:
      type: object
      properties:
        entrySeq:
          type: integer
          format: int64
        entryDate:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/AuditLogUser'
        object:
          type: string
        action:
          type: string
        details:
          type: object

    AuditLogUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key authentication. Use format "apikey"
    SessionToken:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session-based authentication

security:
  - ApiKeyAuth: []
  - SessionToken: []
