openapi: 3.0.3
info:
  title: Concord Ansible Plugin API
  description: |
    Concord Ansible Plugin API provides endpoints for retrieving Ansible execution data
    from Concord processes, including playbooks, plays, tasks, hosts, and events.
  version: 2.32.1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: Concord Development Team
    url: https://concord.walmartlabs.com

servers:
  - url: /api
    description: Concord Server API

tags:
  - name: Ansible Process
    description: Ansible process execution data

paths:
  /v1/process/{processInstanceId}/ansible/playbooks:
    get:
      tags:
        - Ansible Process
      summary: List Ansible playbooks
      description: Returns a list of Ansible playbooks executed in a specific process
      operationId: listPlaybooks
      parameters:
        - name: processInstanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Process instance ID
      responses:
        '200':
          description: List of playbooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaybookEntry'

  /v1/process/{processInstanceId}/ansible/{playbookId}/plays:
    get:
      tags:
        - Ansible Process
      summary: List Ansible plays
      description: Returns a list of Ansible plays for a specific playbook in a process
      operationId: listPlays
      parameters:
        - name: processInstanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Process instance ID
        - name: playbookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Playbook ID
      responses:
        '200':
          description: List of plays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayInfo'

  /v1/process/{processInstanceId}/ansible/tasks:
    get:
      tags:
        - Ansible Process
      summary: List Ansible tasks
      description: Returns a list of Ansible tasks for a specific play in a process
      operationId: listTasks
      parameters:
        - name: processInstanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Process instance ID
        - name: playId
          in: query
          schema:
            type: string
            format: uuid
          description: Play ID to filter tasks
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskInfo'

  /v1/process/{processInstanceId}/ansible/hosts:
    get:
      tags:
        - Ansible Process
      summary: List Ansible hosts
      description: Returns a list of Ansible hosts targeted in a specific process
      operationId: listAnsibleHosts
      parameters:
        - name: processInstanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Process instance ID
        - name: host
          in: query
          schema:
            type: string
          description: Filter by host name (partial match)
        - name: hostGroup
          in: query
          schema:
            type: string
          description: Filter by host group
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AnsibleHostStatus'
          description: Filter by host status
        - name: statuses
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AnsibleHostStatus'
          description: Filter by multiple host statuses
        - name: playbookId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by playbook ID
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
          description: Maximum number of results to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of results to skip
        - name: sortField
          in: query
          schema:
            $ref: '#/components/schemas/SortField'
          description: Field to sort by
        - name: sortBy
          in: query
          schema:
            $ref: '#/components/schemas/SortBy'
          description: Sort direction
      responses:
        '200':
          description: List of hosts with host groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnsibleHostListResponse'

  /v1/process/{processInstanceId}/ansible/events:
    get:
      tags:
        - Ansible Process
      summary: List Ansible events
      description: Returns a list of Ansible events from a specific process
      operationId: listEvents
      parameters:
        - name: processInstanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Process instance ID
        - name: host
          in: query
          schema:
            type: string
          description: Filter by host name
        - name: hostGroup
          in: query
          schema:
            type: string
          description: Filter by host group
        - name: status
          in: query
          schema:
            type: string
          description: Filter by status
        - name: playbookId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by playbook ID
      responses:
        '200':
          description: List of Ansible events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessEventEntry'

components:
  schemas:
    PlaybookEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Playbook ID
        name:
          type: string
          description: Playbook name
        startedAt:
          type: string
          format: date-time
          description: Playbook start time
        hostsCount:
          type: integer
          description: Total number of hosts
        failedHostsCount:
          type: integer
          description: Number of failed hosts
        playsCount:
          type: integer
          description: Number of plays in the playbook
        failedTasksCount:
          type: integer
          format: int64
          description: Number of failed tasks
        progress:
          type: integer
          description: Execution progress percentage (0-100)
        status:
          $ref: '#/components/schemas/PlaybookStatus'
        retryNum:
          type: integer
          description: Retry attempt number

    PlaybookStatus:
      type: string
      enum:
        - RUNNING
        - OK
        - FAILED
      description: Playbook execution status

    PlayInfo:
      type: object
      properties:
        playId:
          type: string
          format: uuid
          description: Play ID
        playName:
          type: string
          description: Play name
        playOrder:
          type: integer
          description: Play execution order
        hostCount:
          type: integer
          format: int64
          description: Number of hosts in the play
        taskCount:
          type: integer
          description: Number of tasks in the play
        finishedTaskCount:
          type: integer
          format: int64
          description: Number of completed tasks
        taskStats:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Task statistics by status (ok, failed, unreachable, skipped, running)

    TaskInfo:
      type: object
      properties:
        taskName:
          type: string
          description: Task name
        taskOrder:
          type: integer
          description: Task execution order
        type:
          $ref: '#/components/schemas/TaskType'
        okCount:
          type: integer
          format: int64
          description: Number of successful executions
        failedCount:
          type: integer
          format: int64
          description: Number of failed executions
        unreachableCount:
          type: integer
          format: int64
          description: Number of unreachable hosts
        skippedCount:
          type: integer
          format: int64
          description: Number of skipped executions
        runningCount:
          type: integer
          format: int64
          description: Number of currently running executions

    TaskType:
      type: string
      enum:
        - TASK
        - HANDLER
      description: Type of Ansible task

    AnsibleHostEntry:
      type: object
      properties:
        host:
          type: string
          description: Host name
        hostGroup:
          type: string
          description: Host group name
        duration:
          type: integer
          format: int64
          description: Execution duration in milliseconds
        status:
          $ref: '#/components/schemas/AnsibleHostStatus'

    AnsibleHostStatus:
      type: string
      enum:
        - RUNNING
        - CHANGED
        - FAILED
        - OK
        - SKIPPED
        - UNREACHABLE
      description: Ansible host execution status

    AnsibleHostListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnsibleHostEntry'
          description: List of host entries
        hostGroups:
          type: array
          items:
            type: string
          description: List of available host groups

    SortField:
      type: string
      enum:
        - HOST
        - HOST_GROUP
        - DURATION
        - STATUS
      description: Field to sort results by

    SortBy:
      type: string
      enum:
        - ASC
        - DESC
      description: Sort direction

    ProcessEventEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Event ID
        eventType:
          type: string
          description: Type of event
        eventDate:
          type: string
          format: date-time
          description: Event timestamp
        data:
          type: object
          description: Event data payload

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key authentication. Use format "apikey"
    SessionToken:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session-based authentication

security:
  - ApiKeyAuth: []
  - SessionToken: []
